name: Java CI with Maven

on:
  push:
    branches: [ "main" ] # Triggers whenever you push to main
  pull_request:
    branches: [ "main" ] # Triggers on pull requests to main

jobs:
  build:
    runs-on: ubuntu-latest # The "Robot" runs on a Linux machine

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4 # Step 1: Download your code

    - name: Set up JDK 17
      uses: actions/setup-java@v4 # Step 2: Install Java
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven # This makes future builds faster

    - name: Build and Test
      run: mvn -B package # Step 3: Compile, Test, and Package
